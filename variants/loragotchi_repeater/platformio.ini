; Stock repeater role plus isolated LRX endpoint. One tank carrier per image.

[tank_Heltec_v3]
extends = env:Heltec_v3_repeater
build_flags =
  ${Heltec_lora32_v3.build_flags}
  -D LORAGOTCHI_REPEATER_TANK=1
  -D ADVERT_NAME='"LRX1 Tank 🐟"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='""'
  -D MAX_NEIGHBOURS=50
  -D DISPLAY_CLASS=SSD1306Display
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  +<../examples/simple_repeater/MyMesh.cpp>
  +<../examples/simple_repeater/UITask.cpp>
  +<../examples/repeater_tank/*.cpp>
  +<helpers/ui/SSD1306Display.cpp>

[env:Heltec_v3_LoRagotchi_Repeater_usb]
extends = tank_Heltec_v3
build_flags = ${tank_Heltec_v3.build_flags}
  -D LRX_TANK_USB=1
build_src_filter = ${tank_Heltec_v3.build_src_filter}

[env:Heltec_v3_LoRagotchi_Repeater_ble]
extends = tank_Heltec_v3
build_flags = ${tank_Heltec_v3.build_flags}
  -D LRX_TANK_BLE=1
build_src_filter = ${tank_Heltec_v3.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>

[env:Heltec_v3_LoRagotchi_Repeater_wifi]
extends = tank_Heltec_v3
build_flags = ${tank_Heltec_v3.build_flags}
  -D LRX_TANK_WIFI=1
build_src_filter = ${tank_Heltec_v3.build_src_filter}

