; Receiver profiles: derived from existing DX companion boards, no standalone UI.

[rx_heltec_v3]
extends = env:Heltec_v3_LoRaFish_companion_ble
build_flags =
  ${Heltec_lora32_v3.build_flags}
  -I examples/companion_radio/ui-rx
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_BUZZER=6
  -D OFFLINE_QUEUE_SIZE=256
  -D LORAGOTCHI_RX=1
  -D ADVERT_NAME='"Community Tank 🐟"'
build_src_filter =
  ${Heltec_lora32_v3.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>

[env:Heltec_v3_LoRagotchi_RX_usb]
extends = rx_heltec_v3
build_flags = ${rx_heltec_v3.build_flags}
  -D ENABLE_USB_INTERFACE

[env:Heltec_v3_LoRagotchi_RX_ble]
extends = rx_heltec_v3
build_flags = ${rx_heltec_v3.build_flags}
  -D BLE_PIN_CODE=123456

