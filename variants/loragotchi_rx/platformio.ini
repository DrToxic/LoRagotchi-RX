; Reuse the inherited Wireless Paper pins, auto-detecting E213 driver and storage.
; Keep Wi-Fi disabled: aquarium WLAN still uses the authenticated PC/SBC bridge.
[rx_heltec_wireless_paper]
extends = env:Heltec_Wireless_Paper_companion_radio_usb
build_flags =
  ${Heltec_Wireless_Paper_base.build_flags}
  -I examples/companion_radio/ui-rx-paper
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=E213Display
  -D OFFLINE_QUEUE_SIZE=256
  -D LORAGOTCHI_RX=1
  -D LORAGOTCHI_RX_EINK_TASK=1
  -D ADVERT_NAME='"Community Tank 🐟"'
build_src_filter =
  ${Heltec_Wireless_Paper_base.build_src_filter}
  +<helpers/ui/E213Display.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>

[env:Heltec_Wireless_Paper_LoRagotchi_RX_usb]
extends = rx_heltec_wireless_paper
build_flags = ${rx_heltec_wireless_paper.build_flags}
  -D ENABLE_USB_INTERFACE

[env:Heltec_Wireless_Paper_LoRagotchi_RX_ble]
extends = rx_heltec_wireless_paper
build_flags = ${rx_heltec_wireless_paper.build_flags}
  -D BLE_PIN_CODE=123456
